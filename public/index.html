<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>Bomberman</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lobby Screen -->
  <div id="lobby">
    <h1>BOMBERMAN</h1>
    <div id="join-section">
      <div class="join-name-row">
        <input type="text" id="nameInput" placeholder="Enter your name" maxlength="12" autocomplete="off">
        <button id="joinBtn">Join Game</button>
      </div>
      <p class="sprite-label">Choose your character</p>
      <div id="sprite-picker"></div>
    </div>
    <div id="lobby-info" style="display:none;">
      <h2>Lobby</h2>
      <div id="playerList"></div>
      <div id="waiting-queue" style="display:none;"></div>
      <div id="lobby-chat">
        <div id="lobby-chat-messages"></div>
        <div id="lobby-chat-input-row">
          <input type="text" id="lobby-chat-input" placeholder="Say something..." maxlength="200" autocomplete="off">
          <button id="lobby-chat-send">Send</button>
        </div>
      </div>
      <div class="lobby-options">
        <label class="lobby-option-row">
          <span class="option-label">Map</span>
          <select id="mapSelect"></select>
        </label>
        <label class="lobby-option-row">
          <span class="option-label">Item Drop Rate <span id="dropRateVal">30%</span></span>
          <input type="range" id="dropRate" min="0" max="100" value="30">
        </label>
        <!-- Mobile-only: choose between joystick and D-Pad for in-game movement -->
        <div class="lobby-option-row touch-only" id="control-type-row">
          <span class="option-label">Controls</span>
          <div class="control-type-toggle">
            <button type="button" class="ctl-btn" data-ctl="joystick">Joystick</button>
            <button type="button" class="ctl-btn" data-ctl="dpad">D-Pad</button>
          </div>
        </div>
      </div>
      <button id="startBtn" disabled>Start Game (need 2+ players)</button>
      <button id="leaveLobbyBtn">Leave Lobby</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game" style="display:none;">

    <!-- Left panel: movement controls. One of { joystick, dpad } is visible at a
         time, controlled by the Lobby → Controls setting (mobile only). -->
    <div id="game-ctrl-dpad">
      <div id="joystick">
        <div id="joystick-base" data-zone="dead" data-dir="">
          <div id="joystick-ring"></div>
          <div id="joystick-knob"></div>
        </div>
      </div>
      <div id="dpad" style="display:none;">
        <button type="button" class="dpad-btn" data-dir="up"    aria-label="Up">▲</button>
        <button type="button" class="dpad-btn" data-dir="left"  aria-label="Left">◀</button>
        <button type="button" class="dpad-btn" data-dir="right" aria-label="Right">▶</button>
        <button type="button" class="dpad-btn" data-dir="down"  aria-label="Down">▼</button>
      </div>
    </div>

    <!-- Center: header + canvas -->
    <div id="game-main">
      <div id="spectator-banner" style="display:none;"></div>
      <div id="game-chat-overlay">
        <div id="game-chat-messages"></div>
        <div id="game-chat-input-row" style="display:none;">
          <input type="text" id="game-chat-input" placeholder="Message..." maxlength="200" autocomplete="off">
          <button id="game-chat-send">↩</button>
        </div>
        <button id="game-chat-btn">💬</button>
      </div>
      <div id="died-overlay" style="display:none;">
        <div id="died-msg">😎 You died!</div>
        <div id="died-winner"></div>
      </div>
      <div id="game-header">
        <div id="scoreboard"></div>
        <div id="game-timer">0:00</div>
        <button id="quitBtn">✕ Quit</button>
      </div>
      <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Right panel: Bomb button (portrait=bottom-right, landscape=right side) -->
    <div id="game-ctrl-bomb">
      <button id="bombBtn">BOMB</button>
    </div>

  </div>

  <!-- Round End Overlay -->
  <div id="roundEnd" style="display:none;">
    <div id="roundEndDied" style="display:none;">😎 You died!</div>
    <div id="roundEndText"></div>
  </div>

  <!-- Quit Confirmation Modal -->
  <div id="quitModal" style="display:none;">
    <div id="quitModalBox">
      <p>Quit the game?</p>
      <div class="quit-buttons">
        <button id="quitConfirm">Yes, Quit</button>
        <button id="quitCancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
