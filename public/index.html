<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>Bomberman</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lobby Screen -->
  <div id="lobby">
    <h1>BOMBERMAN</h1>
    <div id="join-section">
      <div class="join-name-row">
        <input type="text" id="nameInput" placeholder="Enter your name" maxlength="12" autocomplete="off">
        <button id="joinBtn">Join Game</button>
      </div>
      <p class="sprite-label">Choose your character</p>
      <div id="sprite-picker"></div>
    </div>
    <div id="lobby-info" style="display:none;">
      <h2>Lobby</h2>
      <div id="playerList"></div>
      <div id="waiting-queue" style="display:none;"></div>
      <div class="lobby-options">
        <label class="lobby-option-row">
          <span class="option-label">Map</span>
          <select id="mapSelect"></select>
        </label>
        <label class="lobby-option-row">
          <span class="option-label">Item Drop Rate <span id="dropRateVal">30%</span></span>
          <input type="range" id="dropRate" min="0" max="100" value="30">
        </label>
      </div>
      <button id="startBtn" disabled>Start Game (need 2+ players)</button>
      <button id="leaveLobbyBtn">Leave Lobby</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game" style="display:none;">

    <!-- Left panel: D-pad (portrait=bottom-left, landscape=left side) -->
    <div id="game-ctrl-dpad">
      <div id="dpad">
        <button class="dpad-btn" id="dpad-up" data-dir="up">&#9650;</button>
        <div class="dpad-mid-row">
          <button class="dpad-btn" id="dpad-left" data-dir="left">&#9664;</button>
          <div class="dpad-center"></div>
          <button class="dpad-btn" id="dpad-right" data-dir="right">&#9654;</button>
        </div>
        <button class="dpad-btn" id="dpad-down" data-dir="down">&#9660;</button>
      </div>
    </div>

    <!-- Center: header + canvas -->
    <div id="game-main">
      <div id="spectator-banner" style="display:none;"></div>
      <div id="died-overlay" style="display:none;">💀 You died!</div>
      <div id="game-header">
        <div id="scoreboard"></div>
        <div id="game-timer">0:00</div>
        <button id="quitBtn">✕ Quit</button>
      </div>
      <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Right panel: Bomb button (portrait=bottom-right, landscape=right side) -->
    <div id="game-ctrl-bomb">
      <button id="bombBtn">BOMB</button>
    </div>

  </div>

  <!-- Round End Overlay -->
  <div id="roundEnd" style="display:none;">
    <div id="roundEndText"></div>
  </div>

  <!-- Quit Confirmation Modal -->
  <div id="quitModal" style="display:none;">
    <div id="quitModalBox">
      <p>Quit the game?</p>
      <div class="quit-buttons">
        <button id="quitConfirm">Yes, Quit</button>
        <button id="quitCancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
